name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAILWIND_VERSION: 3.4.17

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/*.csproj
            tests/**/*.csproj

      - name: Cache Tailwind binary
        id: tailwind-cache
        uses: actions/cache@v4
        with:
          path: tools/tailwindcss
          key: tailwind-${{ runner.os }}-${{ env.TAILWIND_VERSION }}

      - name: Download Tailwind binary
        if: steps.tailwind-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -fsSL -o tools/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tools/tailwindcss

      - name: Restore
        run: dotnet restore tests/MyBooksKanban.Tests/MyBooksKanban.Tests.csproj

      - name: Build
        run: dotnet build tests/MyBooksKanban.Tests/MyBooksKanban.Tests.csproj --configuration Release --no-restore

      - name: Check app.css is up to date
        run: git diff --exit-code -- src/wwwroot/app.css

      - name: Test
        run: >
          dotnet test tests/MyBooksKanban.Tests/MyBooksKanban.Tests.csproj --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
